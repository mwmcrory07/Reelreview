<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ReelReview</title>
    <link rel="stylesheet" href="bootstrap/css/bootstrap.css">
    <link rel="stylesheet" href="mystyles.css">

</head>


<body>
    <div class="modal fade" tabindex="-1" id = "review_modal">
    <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title">Review this film</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <div class="modal-body">
        <p id = "film_title">x</p>
        <div class = "row">
            <div class = "col-sm text-center">
                <p>Give a comment on the film</p>
                <select class="form-select" aria-label="Default select example" id = "user_rating">
                <option value = "0">I loved this film</option>
                <option value = "1" >This film was enjoyable</option>
                <option value = "2" >This film was good but not really the type of film I enjoy</option>
                <option value = "3">I didn't like this film</option>
                </select>
            </div>
            <div class = "col-sm text-center">

                <p>Give a star rating to contribute to this film's average rating :</p>

                <span onclick="update_stars(1)" class="star" id = "star1">★</span>
                <span onclick="update_stars(2)" class="star" id = "star2">★</span>
                <span onclick="update_stars(3)" class="star" id = "star3">★</span>
                <span onclick="update_stars(4)" class="star" id = "star4">★</span>
                <span onclick="update_stars(5)" class="star" id = "star5">★</span>

            </div>
        </div>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
        <button type="button" class="btn btn-danger" id = "submit_review">Submit review</button>
      </div>
    </div>
    </div>
    </div>
    <div class="modal fade" tabindex="-1" id = "film_modal">
    <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title">Add a new film</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <div class="modal-body">
        <form action = "film/new" method = "post" id = "film_form">
            <div class = "row">
            <div class = "col-sm-6">
            <div class = "mb-3">
                <label for = "new_title" class = "form_label">Enter the title</label>
                <br>
                <input type = "text" class = "form_control" id = "new_title" name="title">
            </div>
                <div class = "mb-3">
                <label for = "new_image" class = "form_label">Enter the image link</label>
                <br>
                <input type = "text" class = "form_control" id = "new_image" name = "image">
                </div>
 
            </div>
            <div class = "col-sm-6">

           <div class = "mb-3">
                <label for = "new_director" class = "form_label">Enter the director</label>
                <br>
                <input type = "text" class = "form_control" id = "new_director" name="director">
            </div>
                <div class = "mb-3">
                <label for = "new_image_src" class = "form_label">Enter the image reference</label>
                <br>
                <input type = "text" class = "form_control" id = "new_image_src" name="img_src">
                </div>
            </div>
            <hr>
            </div>
            <div class = "row">


            <div class = "col-sm-7">
            
            <label for = "admin_key" class = "form_label" >Enter the admin key</label>
            <br>
            <input class = "form_control" id = "admin_key" aria-describedby="admin_description" name="admin_key"type="password">
            <div id="admin_description" class = "form-text">Only admins can create new films</div>
            </div>
            <div class = "col-sm-5 align-self-center">
            <button type="submit" class="btn btn-danger" id = "submit_film">Submit film</button>
            </div>
            </div>
        </form>
        <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
        
        </div>

      </div>
    </div>
    </div>
    </div>
    </div>
    <nav class = "navbar bg-body-tertiary navbar-inverse">
        

        
        <div class="container-fluid">
        <div class = "navbar-header">
        <h1 class="navbar-brand mb-0 h1" style = "font-size: xx-large;padding-left: 5%;">ReelReview</h1>
        </div>
        <button class = "btn btn-danger navbar-btn" onclick="add_film()">Add a film</button>
        </div>
     </div>
    </nav>

    

    <hr class = "separator-line">

    <div class = "container text-center"  style = "padding-right:15%;padding-left: 5%;">
        <div class = "row"  >
            
            <div class = "col-sm-8 align-self-center" style = "font-size: xx-large;">
                Films | Directors | Reviews
            </div>
           
            <div class = "col-sm-4 align-self-center">

                
                    <div class="dropdown" id = "director_dropdown">
                    <button class="btn btn-danger dropdown-toggle" type="button" data-bs-toggle="dropdown" aria-expanded="false"role="button">
                    Filter by director
                    </button>
                    <ul class = "dropdown-menu">
                    <li><button class = "dropdown-item" onclick="clear_info()">All</button></li>
                    <li><hr class = "dropdown-divider"></li>
                    <li><button class = "dropdown-item" onclick="update_director('Christopher Nolan')">Christopher Nolan</button></li>
                    <li><button class = "dropdown-item" href="">Steven Spielberg</button></li>
                    <li><button class = "dropdown-item" href="">Martin Scorsese</button></li>
                    </ul>
                </div>
                    

    

            </div>
        </div>
    </div>
    <hr class = "separator-line">


    <div class = "container text-center" id ="director_info">
        <div class="row">
            <div class = "col-sm-4 align-self-center" style = "font-size:medium;">
                
                
                <img src="" alt = "director_img" height="250px"width="200px" id= "director_image">

                <p id="director_image_src">Image sourced from : </p>

            </div>
            <div class = "col-sm-8 align-self-center">
                <div class = "container text-center">
                    <div class = "row align-self-center" style = "padding: 15px;">
                        <p id = "director_description"></p>
                    </div>
                    <div class = "row align-self-center">
                        <div class = "col-sm-12 align-self-center">
                            <p>Average star rating : </p>
                            <img src="images/1stars.png" height="75px" width="300px" id="average_rating_image">
                        </div>
                    </div>
                </div>
            </div>

        </div>
        
    </div>




    <hr class = "separator-line" id = "director_bar">



    <div class  = "container text-center" id ="films_grid"></div>

    
 
    <script src = "bootstrap/js/bootstrap.bundle.js"></script>
    <script src = "index.js"></script>
</body>
</html>
